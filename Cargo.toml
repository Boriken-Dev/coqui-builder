[package]
name = "coqui-builder"
version = "0.0.0-alpha.0"
description = "Describe the settings a builder takes as data: fill them from any source, check them against a profile, report what differs from the defaults. No dependencies."
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-builder"
homepage = "https://boriken-dev.github.io/coqui-builder/"
keywords = ["builder", "settings", "configuration", "profile"]
categories = ["config", "no-std"]
exclude = [".*", "*.local.*", "/tools/"]
# Nothing is published until the owner chooses a release.
publish = false

[workspace]
members = [".", "crates/coqui-builder-derive"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-builder"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

# The `core`/`alloc` lints are set at the library's root, where they hold.
[lints]
workspace = true

[dependencies]
coqui-builder-derive = { version = "=0.0.0-alpha.0", path = "crates/coqui-builder-derive", optional = true }

[dev-dependencies]
# Reads the shared vectors; never reached by a normal build.
serde_json = "1"

[features]
# `std` adds the items that need an operating system or its collections: `PathBuf`, `HashMap`
# and the `Env` source. Nothing else is on by default, and no feature has a dependency but
# `derive`.
default = ["std"]
std = []
derive = ["dep:coqui-builder-derive"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "shapes"
required-features = ["derive"]

[[test]]
name = "derive_leaf"
required-features = ["derive"]

[[test]]
name = "option_none"
required-features = ["derive"]

[[test]]
name = "meaning"
required-features = ["derive"]

[[test]]
name = "differences_vectors"
required-features = ["derive"]

[[test]]
name = "credential"
required-features = ["derive"]

[[test]]
name = "profile"
required-features = ["derive"]

[[test]]
name = "partial"
required-features = ["derive"]

[[test]]
name = "source"
required-features = ["derive"]

[[test]]
name = "env"
required-features = ["derive", "std"]

[[test]]
name = "inspect"
required-features = ["derive"]

[[test]]
name = "report"
required-features = ["derive"]

[[test]]
name = "non_defaults"
required-features = ["derive"]

[[test]]
name = "describable"
required-features = ["derive"]

[[test]]
name = "union"
required-features = ["derive", "std"]

[[test]]
name = "builder"
required-features = ["derive", "std"]
