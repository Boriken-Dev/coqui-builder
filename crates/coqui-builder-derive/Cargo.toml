[package]
name = "coqui-builder-derive"
description = "Derives for coqui-builder: describe, fill and build any struct field by field"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[lib]
name = "coqui_builder_derive"
path = "src/lib.rs"
# A proc-macro crate exports nothing but macros, so the traits the generated code names live
# in `coqui-builder`.
proc-macro = true

# Only these three, as a proc-macro crate is compiled for the host on every cross build.
# `syn` keeps its default (derive-shaped) features; `full` is not needed.
[dependencies]
syn = "2"
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# Reads the attribute spellings (`tests/vectors/attributes.json`); `full` parses the expansions.
serde_json = "1"
syn = { version = "2", features = ["full"] }

# A proc-macro crate is built on the host with `std`; only the documentation and safety lints
# of the workspace apply.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
